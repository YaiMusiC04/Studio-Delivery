<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>YG Lens Photography</title>
  <meta name="description" content="YG Lens Photography — book, follow, save my contact." />
  <meta property="og:title" content="YG Lens Photography" />
  <meta property="og:description" content="Photography. Tap to save my contact or follow on Instagram." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="brand">
      <div class="logo-wrap" aria-label="YG Lens logo">
        <img id="logo-img" src="logo.png" alt="YG Lens" onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'" />
        <div id="logo-text" class="logo-text" style="display:none">
          <span class="logo-top">YG</span>
          <span class="logo-bottom">LENS</span>
        </div>
      </div>
      <h1 class="title">Yg Lens Photography</h1>
      <p class="tagline">Tap a link or scan to share</p>
    </header>

    <section class="qr-section" aria-label="QR code">
      <div class="qr-frame">
        <canvas id="qr" width="320" height="320"></canvas>
      </div>
      <p class="qr-hint">Scan with any phone camera</p>
    </section>

    <nav class="links" aria-label="Contact links">
      <a class="btn btn-primary" href="https://www.instagram.com/yg.lens" target="_blank" rel="noopener">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        </span>
        <span>Instagram</span>
        <span class="btn-meta">@yg.lens</span>
      </a>

      <a class="btn btn-secondary" href="https://wa.me/19396252835" target="_blank" rel="noopener">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </span>
        <span>WhatsApp</span>
        <span class="btn-meta">Message me</span>
      </a>

      <a class="btn btn-ghost" href="contact.vcf" download="YG-Lens-Photography.vcf">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Save Contact</span>
        <span class="btn-meta">.vcf</span>
      </a>
    </nav>

    <footer class="footer">
      <button id="share-btn" class="share">Share this card</button>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
